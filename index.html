<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Production Recipes — Sturgeon Spirits</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7E613F">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="icons/site.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <h1>Production Recipes</h1>
  <a href="distilling.html" class="header-action" aria-label="Distilling recipes">Distilling &rarr;</a>
</header>
<main>
  <div id="demo-banner" class="demo-banner" style="display:none">
    Demo mode — read-only. Add your Apps Script URL to <code>js/config.js</code> to enable editing.
  </div>

  <div class="search-bar">
    <input type="text" id="search" placeholder="Search recipes…" autocomplete="off">
  </div>

  <div class="filters">
    <select id="category-filter"><option value="">All categories</option></select>
    <select id="ttb-filter">
      <option value="">All TTB statuses</option>
      <option value="has_formula">Has formula #</option>
      <option value="no_formula">Missing formula #</option>
      <option value="has_label">Has label/COLA #</option>
      <option value="detailed">Has ingredient detail</option>
    </select>
    <label class="alc-toggle" id="ingredients-toggle-label">
      <input type="checkbox" id="ingredients-toggle">
      <span class="dot"></span>
      With ingredients
    </label>
    <label class="alc-toggle" id="no-ingredients-toggle-label">
      <input type="checkbox" id="no-ingredients-toggle">
      <span class="dot"></span>
      Without ingredients
    </label>
    <button id="new-recipe">+ New recipe</button>
    <button class="secondary" id="export-all">Export CSV</button>
  </div>

  <div id="result-count" class="result-count"></div>

  <div id="recipe-rows" class="recipe-list">
    <div class="empty-state">Loading…</div>
  </div>
</main>
<!-- New recipe — name + category, then straight into the recipe editor.
     Reuses the .run-modal styles from the distilling run editor. -->
<div id="new-recipe-modal" class="run-modal" hidden>
  <div class="run-modal-card">
    <div class="run-modal-head">
      <h2>New recipe</h2>
      <button type="button" class="ghost" id="new-recipe-close" aria-label="Cancel">&times;</button>
    </div>
    <div class="run-modal-body">
      <div class="field">
        <label for="new-recipe-name">Recipe name</label>
        <input type="text" id="new-recipe-name" autocomplete="off" placeholder="e.g. Raspberry Infused Vodka">
      </div>
      <div class="field">
        <label for="new-recipe-category">Category</label>
        <input type="text" id="new-recipe-category" list="category-options" autocomplete="off" placeholder="Start typing, or pick one">
        <datalist id="category-options"></datalist>
      </div>
      <p class="hint">Pick an existing category so the recipe files in with the rest &mdash; Liqueur, Infused Gin, Vodka. Typing something new starts a new group, so watch the spelling.</p>
      <p id="new-recipe-error" class="hint" style="color:#b3261e" hidden></p>
    </div>
    <div class="run-modal-foot">
      <button type="button" class="secondary" id="new-recipe-cancel">Cancel</button>
      <button type="button" id="new-recipe-create">Create recipe</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/abv.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
